name: Agent skills validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-integrations-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch immutable local provenance objects
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          repository = 'https://github.com/atrinik/agent-integrations.git'
          records = json.loads(Path('plugins/atrinik-development/provenance.json').read_text())['local_authored_updates']
          if not isinstance(records, list) or len(records) != 2:
              raise ValueError('Expected two local provenance records')
          revisions = set()
          for record in records:
              if record.get('repository') != repository:
                  raise ValueError('Unexpected local provenance repository')
              for revision in (record['revision'], record['baseline']['revision']):
                  if not isinstance(revision, str) or not re.fullmatch(r'[0-9a-f]{40}', revision):
                      raise ValueError('Expected full immutable provenance revision')
                  revisions.add(revision)
          revisions.add('38a3f01939c67e5172e4a7eedd8f6330e9339bbd')  # Immutable historical provenance anchor.
          root_repository = 'https://github.com/atrinik/atrinik.git'
          updates = json.loads(Path('plugins/atrinik-development/provenance.json').read_text())['current_file_updates']
          if not isinstance(updates, list) or not 1 <= len(updates) <= 8:
              raise ValueError('Expected bounded Root provenance updates')
          root_revisions = set()
          for update in updates:
              if update.get('repository') != root_repository:
                  raise ValueError('Unexpected Root provenance repository')
              revision = update['revision']
              if not isinstance(revision, str) or not re.fullmatch(r'[0-9a-f]{40}', revision):
                  raise ValueError('Expected full immutable Root revision')
              root_revisions.add(revision)
          env = {**os.environ, 'GIT_TERMINAL_PROMPT': '0', 'GIT_NO_LAZY_FETCH': '1'}
          verify_env = {key: value for key, value in env.items() if not key.startswith('GIT_')}
          verify_env.update(GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL=os.devnull,
                            GIT_TERMINAL_PROMPT='0', GIT_NO_LAZY_FETCH='1')
          git = ['git', '--no-replace-objects', '-c', 'credential.helper=', '-c', 'http.extraHeader=']
          for remote, requested in ((repository, revisions), (root_repository, root_revisions)):
              for revision in sorted(requested):
                  # A fresh store per SHA proves the remote serves it, even if checkout already has it.
                  with tempfile.TemporaryDirectory(prefix='verified-provenance-') as temporary:
                      subprocess.run(git + ['init', '--bare', temporary],
                                     env=verify_env, check=True, timeout=30)
                      isolated = git + ['--git-dir', temporary]
                      subprocess.run(isolated + ['fetch', '--depth=1', '--no-tags', '--no-write-fetch-head', remote, revision],
                                     env=verify_env, check=True, timeout=120)
                      kind = subprocess.check_output(isolated + ['cat-file', '-t', revision],
                                                     env=verify_env, timeout=30)
                      if kind != b'commit\n':
                          raise ValueError('Remote provenance identity is not a commit')
                      # Import only verified objects; index-pack does not change refs or shallow history.
                      with tempfile.TemporaryFile() as pack:
                          subprocess.run(isolated + ['pack-objects', '--stdout', '--revs'],
                                         input=(revision + '\n').encode(), stdout=pack,
                                         env=verify_env, check=True, timeout=120)
                          pack.seek(0)
                          subprocess.run(git + ['index-pack', '--stdin'], stdin=pack,
                                         env=env, check=True, timeout=120)
                      subprocess.run(git + ['cat-file', '-e', revision + '^{commit}'],
                                     env=env, check=True, timeout=30)

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate package
        run: |
          python3 -m unittest discover -v
          python3 -W error -m compileall -q -f tests
          git diff --check

  required:
    name: Required checks
    needs: [validate]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "${VALIDATION_RESULT}" = success
