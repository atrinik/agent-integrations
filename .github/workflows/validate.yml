name: Agent skills validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-integrations-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch immutable local provenance objects
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          repository = 'https://github.com/atrinik/agent-integrations.git'
          records = json.loads(Path('plugins/atrinik-development/provenance.json').read_text())['local_authored_updates']
          if not isinstance(records, list) or len(records) != 2:
              raise ValueError('Expected two local provenance records')
          revisions = set()
          for record in records:
              if record.get('repository') != repository:
                  raise ValueError('Unexpected local provenance repository')
              for revision in (record['revision'], record['baseline']['revision']):
                  if not isinstance(revision, str) or not re.fullmatch(r'[0-9a-f]{40}', revision):
                      raise ValueError('Expected full immutable provenance revision')
                  revisions.add(revision)
          env = {**os.environ, 'GIT_TERMINAL_PROMPT': '0', 'GIT_NO_LAZY_FETCH': '1'}
          for revision in sorted(revisions):
              subprocess.run(
                  ['git', '-c', 'credential.helper=', '-c', 'http.extraHeader=',
                   'fetch', '--no-tags', '--no-write-fetch-head', repository, revision],
                  env=env, check=True, timeout=120,
              )
          root_repository = 'https://github.com/atrinik/atrinik.git'
          updates = json.loads(Path('plugins/atrinik-development/provenance.json').read_text())['current_file_updates']
          if not isinstance(updates, list) or not 1 <= len(updates) <= 8:
              raise ValueError('Expected bounded Root provenance updates')
          root_revisions = set()
          for update in updates:
              if update.get('repository') != root_repository:
                  raise ValueError('Unexpected Root provenance repository')
              revision = update['revision']
              if not isinstance(revision, str) or not re.fullmatch(r'[0-9a-f]{40}', revision):
                  raise ValueError('Expected full immutable Root revision')
              root_revisions.add(revision)
          for revision in sorted(root_revisions):
              subprocess.run(
                  ['git', '-c', 'credential.helper=', '-c', 'http.extraHeader=',
                   'fetch', '--depth=1', '--no-tags', '--no-write-fetch-head', root_repository, revision],
                  env=env, check=True, timeout=120,
              )

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate package
        run: |
          python3 -m unittest discover -v
          python3 -W error -m compileall -q -f tests
          git diff --check

  required:
    name: Required checks
    needs: [validate]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "${VALIDATION_RESULT}" = success
